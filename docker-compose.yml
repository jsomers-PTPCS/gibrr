services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gibrr
      POSTGRES_PASSWORD: gibrr
      POSTGRES_DB: gibrr
    ports:
      - "5432:5432"
    volumes:
      - gibrr-postgres-data:/var/lib/postgresql/data

volumes:
  gibrr-postgres-data:
