services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gibrr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gibrr
    volumes:
      - gibrr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gibrr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted machine translation for the "Translate this" post feature
  # (federation/translate.ts) — never exposed outside the compose network,
  # the api service is the only caller. LT_LOAD_ONLY bounds which language
  # models actually get downloaded on first start (each one costs real
  # time/disk — the full catalog is unnecessary for most instances); add
  # to this list in .env.prod if you need a language it doesn't cover.
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${LIBRETRANSLATE_LANGUAGES:-en,es,fr,de,it,pt,zh,ja,ru,ar}
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - gibrr_libretranslate_data:/home/libretranslate/.local
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gibrr:${POSTGRES_PASSWORD}@postgres:5432/gibrr
      PORT: 4000
      DOMAIN: ${API_DOMAIN}
      WEB_ORIGIN: https://${WEB_DOMAIN}
      NODE_ENV: production
      LIBRETRANSLATE_URL: http://libretranslate:5000
      # Web Push — unset in .env.prod ⇒ push notifications stay disabled.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - gibrr_uploads_data:/app/apps/api/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gibrr_caddy_data:/data
      - gibrr_caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  gibrr_postgres_data:
  gibrr_uploads_data:
  gibrr_caddy_data:
  gibrr_caddy_config:
  gibrr_libretranslate_data:
